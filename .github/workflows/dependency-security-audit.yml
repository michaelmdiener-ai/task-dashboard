name: Weekly Dependency and Security Audit

on:
  schedule:
    # Every Monday at 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  dependency-security-audit:
    name: Audit npm dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create audit report directory
        run: mkdir -p audit-reports

      - name: Check for outdated dependencies
        continue-on-error: true
        run: npm outdated --json > audit-reports/npm-outdated.json || true

      - name: Run npm security audit
        run: npm audit --audit-level=high --json > audit-reports/npm-audit.json

      - name: Upload dependency audit reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: dependency-security-audit-${{ github.run_number }}
          path: audit-reports/
          if-no-files-found: error
          retention-days: 30

  codeql:
    name: CodeQL security analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript
