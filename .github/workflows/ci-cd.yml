name: Task Dashboard App CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Explicitly define permissions
permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
    
    - name: Setup Node.js
      uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
      with:
        node-version: '22'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build application (without data hydration)
      run: npm run build
      env:
        VITE_ENABLE_DATA_HYDRATION: 'false'
    
    - name: Run tests
      run: npm test

    # TODO: Add linting steps
    # - name: Run ESLint
    #   run: npm run lint
    #
    # - name: Run accessibility checks
    #   run: npm run lint:a11y

  pages-build-test:
    name: Verify GitHub Pages build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

    - name: Setup Node.js
      uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build GitHub Pages site with data hydration
      run: npm run build
      env:
        VITE_ENABLE_DATA_HYDRATION: 'true'

    - name: Verify generated site
      run: test -s dist/index.html

    # Use the candidate from Dependabot PR #5 so this CI job exercises the
    # upgraded Pages artifact action before the deployment workflow changes.
    - name: Package GitHub Pages artifact
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
      with:
        path: dist
